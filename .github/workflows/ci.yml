name: Build cmark-gfm

on:
  workflow_dispatch:
  push:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Configure CMake (Unix)
      if: matrix.os != 'windows-latest'
      run: |
        cmake -S . -B build \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_POLICY_VERSION_MINIMUM=3.5

    # - name: Configure CMake (Windows)
    #   if: matrix.os == 'windows-latest'
    #   env:
    #     MSYS_NO_PATHCONV: 1
    #   run: |
    #     cmake -S . -B build \
    #       -DCMAKE_BUILD_TYPE=Release \
    #       -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
    #       -DCMARK_SHARED=OFF \
    #       -DCMARK_GFM_EXTENSIONS_SHARED=OFF \
    #       "-DCMAKE_C_FLAGS=/w /MT"
    - name: Configure CMake (Windows)
      if: matrix.os == 'windows-latest'
      shell: pwsh
      run: |
        cmake -S . -B build `
          -DCMAKE_BUILD_TYPE=Release `
          -DCMAKE_POLICY_VERSION_MINIMUM=3.5 `
          -DCMARK_SHARED=OFF `
          -DCMARK_GFM_EXTENSIONS_SHARED=OFF

    - name: Build
      run: cmake --build build --config Release

    - name: Upload binary (Linux)
      if: matrix.os == 'ubuntu-latest'
      uses: actions/upload-artifact@v4
      with:
        name: cmark-gfm-linux
        path: build/src/cmark-gfm

    - name: Upload binary (macOS)
      if: matrix.os == 'macos-latest'
      uses: actions/upload-artifact@v4
      with:
        name: cmark-gfm-macos
        path: build/src/cmark-gfm

    - name: Upload binary
      uses: actions/upload-artifact@v4
      with:
        name: cmark-gfm-${{ matrix.os }}
        path: |
          build/src/cmark-gfm
          build/src/Release/markdown.exe

